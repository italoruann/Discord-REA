# coturn do Discord REA. O segredo e o realm vem do .env (TURN_SECRET / TURN_HOST) pela linha de comando.
# Firewall da VPS: liberar 3478/udp, 3478/tcp e 49160-49200/udp.

listening-port=3478
min-port=49160
max-port=49200
# Se o IP publico NAO estiver na interface da VPS (raro na Hostinger), descomente:
# external-ip=IP_PUBLICO_DA_VPS

# credencial temporaria gerada pelo servidor (HMAC do TURN_SECRET), so para usuarios logados
use-auth-secret
fingerprint

# ---- limites para proteger a VPS (1 vCPU) ----
# max-bps e bps-capacity sao em BYTES/s. 450000 B/s = 3,6 Mbps por sessao (o app manda no maximo 2,5 Mbps de video + audio)
max-bps=450000
# capacidade total: 3 MB/s = 24 Mbps somando todas as sessoes
bps-capacity=3000000
# no maximo 40 alocacoes no total e 6 por usuario
total-quota=40
user-quota=6
stale-nonce=600

# ---- seguranca: o relay so pode falar com IPs publicos (nao com a rede interna/Docker da VPS) ----
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-cli
no-tls
no-dtls
no-software-attribute
log-file=stdout
simple-log
