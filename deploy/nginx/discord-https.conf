# nginx do Discord REA - porta 443. So e ativado (pelo start.sh) quando o certificado existe.

server {
    listen 443 ssl proxy_protocol;
    server_name discord.gendata.tech;

    # o edge (HAProxy) manda o IP real do visitante via PROXY protocol
    set_real_ip_from 172.30.0.0/24;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/discord.gendata.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/discord.gendata.tech/privkey.pem;

    # DNS interno do Docker, resolvido a cada requisicao: o nginx sobe mesmo com o Node fora do ar
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rea_upstream http://discord-rea-server:3478;

    limit_req_status  429;
    limit_conn_status 429;
    limit_conn rea_conn 20;          # conexoes simultaneas por IP (WebSocket + downloads)
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $rea_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        limit_req zone=rea_api burst=20 nodelay;
        proxy_pass $rea_upstream;
    }

    location = /upload {
        limit_req zone=rea_upload burst=10 nodelay;
        client_max_body_size 50m;    # anexos de ate 50 MB
        proxy_request_buffering off;
        proxy_read_timeout 5m;
        proxy_pass $rea_upstream;
    }

    location /files/ {
        limit_req zone=rea_files burst=50 nodelay;
        proxy_pass $rea_upstream;
    }

    # gateway WebSocket (fica aberto)
    location / {
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass $rea_upstream;
    }
}
