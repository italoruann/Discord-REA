# nginx do Discord REA - porta 80 (sempre ativa): desafio do Let's Encrypt + redirect para HTTPS.
# Atras do edge (HAProxy): o IP real chega no X-Forwarded-For.

limit_req_zone  $binary_remote_addr zone=rea_api:10m    rate=5r/s;  # login, cadastro, convites
limit_req_zone  $binary_remote_addr zone=rea_upload:10m rate=1r/s;  # anexos
limit_req_zone  $binary_remote_addr zone=rea_files:10m  rate=20r/s; # download de anexos
limit_conn_zone $binary_remote_addr zone=rea_conn:10m;

map $http_upgrade $rea_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name discord.gendata.tech;

    set_real_ip_from 172.30.0.0/24;   # rede edge
    real_ip_header X-Forwarded-For;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
