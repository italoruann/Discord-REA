# Roteador de borda neutro: fica com as portas 80/443 da VPS e so olha o DOMINIO pedido.
# Nao abre o HTTPS (passthrough): cada projeto tem o seu nginx com os seus certificados.
# Projeto novo = um "use_backend" + um "backend" aqui.

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    timeout connect 5s
    timeout client  1h      # WebSocket fica aberto
    timeout server  1h
    timeout tunnel  1h

# DNS interno do Docker; com "init-addr none" o edge sobe mesmo se um projeto estiver fora do ar
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

# ---------- porta 80: roteia pelo Host (redirects e desafio do Let's Encrypt de cada projeto) ----------
frontend http
    bind :80
    mode http
    option httplog
    option forwardfor
    timeout http-request    10s
    timeout http-keep-alive 10s
    use_backend discord_http if { hdr(host),field(1,:) -i discord.gendata.tech }
    default_backend gendata_http

# ---------- porta 443: roteia pelo SNI do TLS, sem descriptografar ----------
frontend https
    bind :443
    mode tcp
    option tcplog
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend discord_https if { req.ssl_sni -i discord.gendata.tech }
    default_backend gendata_https

# ---------- Discord REA ----------
backend discord_http
    mode http
    server nginx discord-rea-nginx:80 resolvers docker init-addr none

backend discord_https
    mode tcp
    # PROXY protocol: o nginx do discord recebe o IP real do visitante (limite de tentativas por IP)
    server nginx discord-rea-nginx:443 send-proxy-v2 resolvers docker init-addr none

# ---------- gendata.tech (tambem e o destino padrao: www, dominios desconhecidos etc.) ----------
backend gendata_http
    mode http
    server nginx gendata-nginx:80 resolvers docker init-addr none

backend gendata_https
    mode tcp
    # Sem PROXY protocol: o gendata nao precisa mudar a config dele. Para o gendata tambem ver o IP real,
    # acrescente "send-proxy-v2" aqui E "proxy_protocol" no listen 443 do nginx dele (veja deploy/DEPLOY.md).
    server nginx gendata-nginx:443 resolvers docker init-addr none
