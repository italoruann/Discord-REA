<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; connect-src 'self' ws: wss: http: https:">
  <title>Discord REA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="titlebar">
    <div class="tb-title">Discord REA</div>
    <div class="tb-controls">
      <button id="tb-min" title="Minimizar"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="5.5" width="10" height="1" fill="currentColor"/></svg></button>
      <button id="tb-max" title="Maximizar"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
      <button id="tb-close" class="close" title="Fechar"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </div>

  <!-- tela de login -->
  <div id="login" class="hidden">
    <form id="login-form" class="login-card">
      <h1>Boas-vindas de volta!</h1>
      <p class="sub">Estamos muito animados em te ver novamente!</p>
      <label><span>NOME DE USUARIO <span class="req">*</span></span><input id="login-name" maxlength="32" autocomplete="username" required></label>
      <label><span>SENHA <span class="req">*</span></span><input id="login-password" type="password" autocomplete="current-password" required></label>
      <label class="server-field hidden">ENDERECO DO SERVIDOR<input id="login-server" class="server-input"></label>
      <div class="error"></div>
      <button type="submit" class="btn-brand big">Entrar</button>
      <div class="login-switch">Recebeu um convite? <a data-goto="register-form">Registre-se</a></div>
    </form>

    <form id="register-form" class="login-card hidden">
      <h1>Criar uma conta</h1>
      <p class="sub">Use o codigo de convite que voce recebeu</p>
      <label><span>CODIGO DE CONVITE <span class="req">*</span></span><input id="reg-code" placeholder="XXXX-XXXX-XXXX" maxlength="14" autocomplete="off" required></label>
      <label><span>NOME DE USUARIO <span class="req">*</span></span><input id="reg-name" maxlength="32" autocomplete="username" required></label>
      <div id="reg-step2" class="hidden">
        <label><span>SENHA <span class="req">*</span></span><input id="reg-password" type="password" minlength="8" autocomplete="new-password"></label>
        <label><span>CONFIRMAR SENHA <span class="req">*</span></span><input id="reg-password2" type="password" minlength="8" autocomplete="new-password"></label>
      </div>
      <label class="server-field hidden">ENDERECO DO SERVIDOR<input id="reg-server" class="server-input"></label>
      <div class="error"></div>
      <button type="submit" class="btn-brand big">Continuar</button>
      <div class="login-switch">Ja tem uma conta? <a data-goto="login-form">Entrar</a></div>
    </form>
  </div>

  <div id="connecting" class="hidden"><div class="spinner"></div><div>Conectando...</div></div>

  <div id="app" class="hidden">
    <nav id="guilds"></nav>

    <aside id="sidebar">
      <header id="guild-header"><span id="guild-name"></span><svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg></header>
      <div id="channels" class="scroller"></div>
      <section id="voice-panel" class="hidden">
        <div class="vp-top">
          <div class="vp-info">
            <div class="vp-status"><span class="ping-bars"></span><span id="vp-status-text">Voz conectada</span></div>
            <div id="vp-channel" class="vp-channel"></div>
          </div>
          <button id="vp-disconnect" class="icon-btn" title="Desconectar"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M21.1 13.4c.4-.4.4-1 0-1.4-5-5-13.2-5-18.2 0-.4.4-.4 1 0 1.4l2.1 2.1c.4.4.9.4 1.3.1l2.4-1.8c.3-.2.4-.5.4-.8v-2.1c2.2-.7 4.6-.7 6.8 0V13c0 .3.2.6.4.8l2.4 1.8c.4.3 1 .3 1.3-.1z"/></svg></button>
        </div>
        <div class="vp-actions">
          <button id="vp-camera" class="vp-btn" title="Ligar camera"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M4 6a2 2 0 0 0-2 2v8c0 1.1.9 2 2 2h10a2 2 0 0 0 2-2v-2.4l4.4 2.9c.7.4 1.6 0 1.6-.8V8.3c0-.8-.9-1.2-1.6-.8L16 10.4V8a2 2 0 0 0-2-2z"/></svg></button>
          <button id="vp-screen" class="vp-btn" title="Transmitir tela"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M4 3a2 2 0 0 0-2 2v10c0 1.1.9 2 2 2h7v2H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm8 3.5 4 3.5h-3v3h-2v-3H8z"/></svg></button>
        </div>
      </section>
      <section id="user-panel">
        <div id="me" class="me"></div>
        <button id="btn-mute" class="icon-btn" title="Silenciar"></button>
        <button id="btn-deafen" class="icon-btn" title="Desativar audio"></button>
        <button id="btn-settings" class="icon-btn" title="Configuracoes de usuario"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M10.6 2h2.8l.5 2.6c.7.2 1.3.5 1.9.9l2.3-1.4 2 2-1.4 2.3c.4.6.7 1.2.9 1.9l2.4.5v2.8l-2.4.5c-.2.7-.5 1.3-.9 1.9l1.4 2.3-2 2-2.3-1.4c-.6.4-1.2.7-1.9.9l-.5 2.6h-2.8l-.5-2.6c-.7-.2-1.3-.5-1.9-.9L6 20.3l-2-2 1.4-2.3c-.4-.6-.7-1.2-.9-1.9L2 13.6v-2.8l2.5-.5c.2-.7.5-1.3.9-1.9L4 6.1l2-2 2.3 1.4c.6-.4 1.2-.7 1.9-.9zM12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/></svg></button>
      </section>
    </aside>

    <main id="main">
      <header id="chat-header">
        <span id="ch-icon" class="ch-icon"></span>
        <span id="ch-name" class="ch-name"></span>
        <span id="ch-topic" class="ch-topic"></span>
        <div class="spacer"></div>
        <button id="btn-members" class="icon-btn active" title="Mostrar lista de membros"><svg width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M14.5 8a3 3 0 1 0-2.7-4.3c-.2.4.1.8.5 1A5 5 0 0 1 15 9c0 .4.4.6.7.4.2-.1.3-.3.3-.5-.3-.6-.9-.9-1.5-.9M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8m-7 8c0-3.3 3.1-6 7-6s7 2.7 7 6c0 1.1-.9 2-2 2H4a2 2 0 0 1-2-2m15.6-5.2c-.5-.2-.6.6-.3 1a7 7 0 0 1 1.7 4.2c0 .5.4 1 .9 1h.1c1.1 0 2-.9 2-2 0-2.1-1.7-3.6-4.4-4.2"/></svg></button>
      </header>
      <div id="content">
        <section id="chat">
          <div id="messages" class="scroller"><div id="messages-inner"></div></div>
          <form id="composer">
            <div id="reply-bar" class="hidden"><span id="reply-text"></span><button type="button" id="reply-cancel">✕</button></div>
            <div id="upload-preview" class="hidden"></div>
            <div class="composer-box">
              <button type="button" id="btn-attach" class="icon-btn" title="Enviar arquivo"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 7v10M7 12h10" stroke="var(--bg-input)" stroke-width="2" stroke-linecap="round"/></svg></button>
              <input type="file" id="file-input" multiple hidden>
              <textarea id="input" rows="1" maxlength="4000"></textarea>
              <button type="button" id="btn-emoji" class="icon-btn" title="Emoji">😀</button>
            </div>
            <div id="typing"></div>
          </form>
        </section>
        <section id="call" class="hidden">
          <div id="call-grid"></div>
          <div id="call-controls">
            <button id="cc-mute" class="cc-btn" title="Silenciar"></button>
            <button id="cc-camera" class="cc-btn" title="Camera"></button>
            <button id="cc-screen" class="cc-btn" title="Transmitir tela"></button>
            <button id="cc-leave" class="cc-btn danger" title="Desconectar"><svg width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M21.1 13.4c.4-.4.4-1 0-1.4-5-5-13.2-5-18.2 0-.4.4-.4 1 0 1.4l2.1 2.1c.4.4.9.4 1.3.1l2.4-1.8c.3-.2.4-.5.4-.8v-2.1c2.2-.7 4.6-.7 6.8 0V13c0 .3.2.6.4.8l2.4 1.8c.4.3 1 .3 1.3-.1z"/></svg></button>
          </div>
          <div id="call-join" class="hidden">
            <div class="cj-title"></div>
            <div class="cj-sub">Ninguem esta na chamada no momento</div>
            <button id="cj-btn" class="btn-green">Entrar na chamada de voz</button>
          </div>
        </section>
        <aside id="members" class="scroller"></aside>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="ctx-menu" class="ctx hidden"></div>
  <div id="tooltip" class="hidden"></div>

  <script src="audio.js"></script>
  <script src="rtc.js"></script>
  <script src="app.js"></script>
</body>
</html>
